<div class="recipe">
    {% if recipe.cover %}
        <img src="{{recipe.cover.url}}" alt="">
    {% endif %}
    <a href={% url "recipes:detail" recipe.id %}><h3>{{recipe.title}}</h3></a>
    <h4>{{recipe.description}}</h4>
    {% if is_detail_page is not True %}
        <button>comprar</button>
    {% endif %}
</div>
